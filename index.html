<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squint — a daily picture puzzle</title>
<meta name="description" content="One picture. Six looks. A new zoomed-in puzzle every day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --ink: #1C1D1F;
    --muted: #6B6C70;
    --line: #DEDCD5;
    --accent: #16756C;
    --accent-ink: #FFFFFF;
    --miss: #C4452F;
    --hit: #2C8A55;
    --frame: #1C1D1F;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141516;
      --surface: #1E2022;
      --ink: #ECEBE7;
      --muted: #9A9B9F;
      --line: #33363A;
      --accent: #3FB3A6;
      --accent-ink: #0D1A18;
      --miss: #E06A52;
      --hit: #4CC07F;
      --frame: #2E3134;
      color-scheme: dark;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 460px; margin: 0 auto; padding: 14px 0 48px; }

  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .logo { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .logo-i { position: relative; display: inline-block; }
  .lens {
    position: absolute; left: 50%; top: -0.06em; width: 0.3em; height: 0.3em; transform: translateX(-50%);
    border: 0.075em solid var(--accent); border-radius: 50%; background: var(--bg);
  }
  .meta { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .icon-btn {
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--muted); }

  /* The viewport: two stacked images take turns being in front */
  .frame {
    position: relative; aspect-ratio: 1 / 1; width: 100%;
    border: 6px solid var(--frame); border-radius: 22px; overflow: hidden; background: var(--line);
  }
  .frame img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    user-select: none; -webkit-user-drag: none; will-change: transform, opacity;
  }
  .frame .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
  .frame.shake { animation: shake 0.35s ease; }
  @keyframes shake {
    20% { transform: translateX(-6px); } 40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(2px); }
  }

  .pips { list-style: none; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 0; margin: 12px 0 0; }
  .pips li { height: 8px; border-radius: 4px; background: var(--line); }
  .pips li.miss { background: var(--miss); }
  .pips li.hit { background: var(--hit); }
  .pips li.now { background: var(--muted); opacity: 0.55; }

  .hint { margin: 14px 0 0; color: var(--muted); }
  .hint strong { color: var(--ink); font-weight: 600; }

  .play { margin-top: 16px; }
  .combo { position: relative; }
  .combo input {
    width: 100%; padding: 13px 16px; font-size: 1.05rem;
    border: 2px solid var(--line); border-radius: 14px; background: var(--surface);
  }
  .combo input:focus { border-color: var(--accent); outline: none; }
  .options {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); z-index: 5;
    list-style: none; margin: 0; padding: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  }
  .options li { padding: 9px 12px; border-radius: 9px; cursor: pointer; }
  .options li[aria-selected="true"], .options li:hover { background: var(--bg); }
  .options mark { background: none; color: var(--accent); font-weight: 600; }

  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .btn { border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
  .btn.ghost { background: transparent; border: 2px solid var(--line); }
  .btn.ghost:hover { border-color: var(--muted); }
  .btn:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }

  .message { min-height: 1.45em; margin: 10px 0 0; color: var(--muted); text-align: center; }

  .result { margin-top: 18px; text-align: center; }
  .verdict { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
  .answer-line { margin: 6px 0 16px; color: var(--muted); }
  .result .btn { width: 100%; }
  .next { color: var(--muted); margin: 12px 0 0; font-variant-numeric: tabular-nums; }

  .history { list-style: none; padding: 0; margin: 18px 0 0; }
  .history li { display: flex; justify-content: space-between; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .history li:last-child { border-bottom: 0; }
  .history .tag { color: var(--miss); }
  .history .skip .tag, .history .skip .word { color: var(--muted); }
  .history .hit .tag { color: var(--hit); }

  dialog {
    width: min(400px, calc(100vw - 32px)); border: 0; border-radius: 20px; padding: 22px;
    background: var(--surface); color: var(--ink);
  }
  dialog::backdrop { background: rgba(0,0,0,0.45); }
  .dialog-head { display: flex; justify-content: space-between; align-items: center; }
  dialog h2 { margin: 0; font-size: 1.35rem; }
  dialog h3 { font-size: 1rem; margin: 22px 0 10px; }
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; text-align: center; }
  .stat-row b { display: block; font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
  .stat-row span { font-size: 0.82rem; color: var(--muted); }
  .dist-row { display: grid; grid-template-columns: 1.2em 1fr; gap: 8px; align-items: center; margin: 5px 0; font-variant-numeric: tabular-nums; }
  .bar { background: var(--line); color: var(--ink); padding: 2px 8px; border-radius: 6px; text-align: right; min-width: 2em; font-size: 0.9rem; }
  .bar.today { background: var(--accent); color: var(--accent-ink); }

  @media (prefers-reduced-motion: reduce) { .frame.shake { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="logo" aria-label="Squint"><span aria-hidden="true">Squ<span class="logo-i">ı<span class="lens"></span></span>nt</span></h1>
    <div class="meta">
      <span id="num"></span>
      <button class="icon-btn" id="statsBtn" aria-label="Your stats">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="9" width="3" height="7" rx="1" fill="currentColor"/><rect x="7.5" y="4" width="3" height="12" rx="1" fill="currentColor"/><rect x="13" y="7" width="3" height="9" rx="1" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="frame" id="frame" role="img" aria-label="Loading today's picture">
      <img id="imgA" alt="" draggable="false" style="z-index:2">
      <img id="imgB" alt="" draggable="false" style="z-index:1">
      <div class="loading" id="loading">Loading today's picture…</div>
    </div>
    <ol class="pips" id="pips" aria-label="Guesses used"></ol>
    <p class="hint" id="hint" hidden></p>

    <div class="play" id="play">
      <div class="combo">
        <input id="guess" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="options" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="What is it?" aria-label="Your guess" disabled>
        <ul class="options" id="options" role="listbox" hidden></ul>
      </div>
      <div class="actions">
        <button class="btn primary" id="guessBtn" disabled>Guess</button>
        <button class="btn ghost" id="skipBtn" disabled>Skip</button>
      </div>
    </div>

    <p class="message" id="message" role="status" aria-live="polite"></p>

    <section class="result" id="result" hidden>
      <p class="verdict" id="verdict"></p>
      <p class="answer-line" id="answerLine"></p>
      <button class="btn primary" id="shareBtn">Copy result</button>
      <p class="next">Next picture in <span id="countdown"></span></p>
    </section>

    <ul class="history" id="history"></ul>
  </main>
</div>

<dialog id="stats" aria-labelledby="statsTitle">
  <div class="dialog-head">
    <h2 id="statsTitle">Your stats</h2>
    <button class="icon-btn" id="closeStats" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="stat-row" id="statRow"></div>
  <h3>Guesses to solve</h3>
  <div id="dist"></div>
</dialog>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const SITE_URL = "squint.game";          // change to your real domain
const LAUNCH = Date.UTC(2026, 10, 18);   // date of puzzle #1 (months are 0-based: 10 = November)
const MAX_GUESSES = 6;
const FULL = 6;                          // index of the full-picture image in each puzzle
const VERDICTS = ["Eagle eye.", "Sharp.", "Nicely spotted.", "Solid.", "Got there.", "Phew. Just in time."];

/* =========================================================
   WHICH DAY IS IT
   ========================================================= */
function dayIndexFor(d) {
  return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - LAUNCH) / 86400000);
}
const params = new URLSearchParams(location.search);
const testMode = params.has("day");      // ?day=2 previews puzzle #2 without touching your stats
let dayIndex = testMode ? (parseInt(params.get("day"), 10) || 1) - 1 : dayIndexFor(new Date());
if (dayIndex < 0) dayIndex = 0;
const puzzleNum = dayIndex + 1;

/* =========================================================
   STATE
   ========================================================= */
let ANSWERS = [];
let puzzle = null;        // { answer, hint, levels, base }
let state = null;
let revealDone = false;
let stats = load("squint-stats", { played: 0, won: 0, streak: 0, maxStreak: 0, lastWon: null, dist: [0,0,0,0,0,0] });

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, value) {
  if (testMode) return;
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

const $ = id => document.getElementById(id);
const frame = $("frame"), input = $("guess"), options = $("options");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const wait = ms => new Promise(r => setTimeout(r, ms));
$("num").textContent = `#${puzzleNum}`;

/* The answer is stored reversed-base64 in game.json, so it isn't readable at a glance. */
function unobscure(s) {
  const bin = atob(s.split("").reverse().join(""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

/* =========================================================
   STARTUP: load answers, schedule, then today's puzzle
   ========================================================= */
async function getJSON(url) {
  const res = await fetch(url, { cache: "no-cache" });
  if (!res.ok) throw new Error(`${res.status} loading ${url}`);
  return res.json();
}

async function start() {
  try {
    const [answers, schedule] = await Promise.all([getJSON("answers.json"), getJSON("puzzles/schedule.json")]);
    const folder = schedule[dayIndex];
    if (!folder) {
      $("loading").textContent = "No puzzle is scheduled for today. Check back tomorrow.";
      return;
    }
    const g = await getJSON(`puzzles/${folder}/game.json`);
    puzzle = { answer: unobscure(g.a), hint: g.hint || "", levels: g.levels, base: `puzzles/${folder}/` };

    ANSWERS = answers.slice();
    if (!ANSWERS.some(a => a.toLowerCase() === puzzle.answer.toLowerCase())) {
      console.warn(`"${puzzle.answer}" isn't in answers.json; adding it so the puzzle can be solved.`);
      ANSWERS.push(puzzle.answer);
      ANSWERS.sort();
    }

    state = load("squint-state", null);
    if (!state || state.puzzle !== puzzleNum || testMode) {
      state = { puzzle: puzzleNum, guesses: [], status: "playing" };
    }

    await showLevel(currentLevel(), false);
    $("loading").hidden = true;
    revealDone = state.status !== "playing";
    [input, $("guessBtn"), $("skipBtn")].forEach(el => (el.disabled = false));
    render();
  } catch (err) {
    console.error(err);
    $("loading").textContent = location.protocol === "file:"
      ? "The puzzle files can't load from a file opened directly. Run the folder through a local server, such as VS Code's Live Server."
      : "Today's puzzle didn't load. Refresh the page to try again.";
  }
}

const currentLevel = () => (state.status === "playing" ? state.guesses.length : FULL);

/* =========================================================
   SMOOTH ZOOM-OUT BETWEEN SEPARATE IMAGES
   The incoming (wider) image starts scaled up so it frames exactly what the
   current image shows, then eases back to normal while the current one fades.
   ========================================================= */
let front = $("imgA"), back = $("imgB");
let shownLevel = null;
let queue = Promise.resolve();

function goTo(level) {
  queue = queue.then(() => showLevel(level, true));
  return queue;
}

async function showLevel(target, animate) {
  if (target === shownLevel) return;
  const animated = animate && shownLevel !== null && target > shownLevel && !reduceMotion.matches;

  back.style.transition = "none";
  if (animated) {
    const c = puzzle.levels[shownLevel].rect, p = puzzle.levels[target].rect;
    const k = p.size / c.size;
    const ox = (k * (c.x - p.x) / (k - 1)) / p.size * 100;
    const oy = (k * (c.y - p.y) / (k - 1)) / p.size * 100;
    back.style.transformOrigin = `${ox}% ${oy}%`;
    back.style.transform = `scale(${k})`;
  } else {
    back.style.transform = "none";
  }
  back.style.opacity = "1";
  back.src = puzzle.base + puzzle.levels[target].file;
  try { await back.decode(); } catch {}

  if (animated) {
    void back.offsetWidth; // apply the starting scale before animating
    const dur = target === FULL ? 1400 : 700;
    back.style.transition = `transform ${dur}ms cubic-bezier(.2,.7,.2,1)`;
    back.style.transform = "scale(1)";
    front.style.transition = "opacity 220ms ease";
    front.style.opacity = "0";
    await wait(dur);
  } else {
    front.style.transition = "none";
    front.style.opacity = "0";
  }

  back.style.zIndex = "2"; front.style.zIndex = "1";
  [front, back] = [back, front];
  shownLevel = target;
  preloadNext();
}

function preloadNext() {
  if (state.status !== "playing") return;
  const next = state.guesses.length + 1;
  if (next <= FULL) new Image().src = puzzle.base + puzzle.levels[next].file;
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const n = state.guesses.length;
  const playing = state.status === "playing";

  frame.setAttribute("aria-label", playing ? "Today's picture, zoomed in" : `The full picture: ${puzzle.answer}`);

  $("pips").innerHTML = Array.from({ length: MAX_GUESSES }, (_, i) => {
    const g = state.guesses[i];
    const cls = g ? (g.correct ? "hit" : "miss") : (playing && i === n ? "now" : "");
    return `<li class="${cls}"></li>`;
  }).join("");

  const misses = state.guesses.filter(g => !g.correct).length;
  $("hint").hidden = !(playing && misses >= 3 && puzzle.hint);
  $("hint").innerHTML = `<strong>Hint:</strong> ${escapeHTML(puzzle.hint)}`;

  $("history").innerHTML = state.guesses.slice().reverse().map(g => {
    const cls = g.correct ? "hit" : g.skip ? "skip" : "";
    const tag = g.correct ? "Correct" : g.skip ? "Skipped" : "Not it";
    return `<li class="${cls}"><span class="word">${g.skip ? "—" : escapeHTML(g.text)}</span><span class="tag">${tag}</span></li>`;
  }).join("");

  $("play").hidden = !playing;
  $("result").hidden = playing || !revealDone;
  if (!playing && revealDone) {
    const won = state.status === "won";
    $("verdict").textContent = won ? VERDICTS[n - 1] : "Not this time.";
    $("answerLine").textContent = won
      ? `The answer: ${puzzle.answer}. Solved in ${n} of ${MAX_GUESSES}.`
      : `The answer was ${puzzle.answer}. We've all been there.`;
    tickCountdown();
  }
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* =========================================================
   GAME ACTIONS
   ========================================================= */
let msgTimer;
function say(text) {
  $("message").textContent = text;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => ($("message").textContent = ""), 2600);
}

function shake() {
  frame.classList.remove("shake");
  void frame.offsetWidth;
  frame.classList.add("shake");
}

function afterGuess(wasCorrect) {
  save("squint-state", state);
  render();
  if (state.status === "playing") {
    if (!wasCorrect) shake();
    goTo(currentLevel());
  } else {
    goTo(FULL).then(() => { revealDone = true; render(); });
  }
}

function submitGuess(raw) {
  if (!state || state.status !== "playing") return;
  const text = raw.trim();
  if (!text) return;
  const match = ANSWERS.find(a => a.toLowerCase() === text.toLowerCase());
  if (!match) { say("Pick an answer from the list."); return; }
  if (state.guesses.some(g => g.text === match)) { say("You already guessed that."); return; }

  const correct = match.toLowerCase() === puzzle.answer.toLowerCase();
  state.guesses.push({ text: match, correct });
  input.value = "";
  closeOptions();
  if (correct) finish(true);
  else if (state.guesses.length >= MAX_GUESSES) finish(false);
  afterGuess(correct);
}

function skip() {
  if (!state || state.status !== "playing") return;
  state.guesses.push({ text: "", skip: true, correct: false });
  if (state.guesses.length >= MAX_GUESSES) finish(false);
  afterGuess(false);
}

function finish(won) {
  state.status = won ? "won" : "lost";
  if (testMode) return;
  stats.played++;
  if (won) {
    stats.won++;
    stats.dist[state.guesses.length - 1]++;
    stats.streak = stats.lastWon === puzzleNum - 1 ? stats.streak + 1 : 1;
    stats.lastWon = puzzleNum;
    stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
  } else {
    stats.streak = 0;
  }
  save("squint-stats", stats);
}

/* =========================================================
   SHARING
   ========================================================= */
function shareText() {
  const won = state.status === "won";
  const row = Array.from({ length: MAX_GUESSES }, (_, i) => {
    const g = state.guesses[i];
    return g ? (g.correct ? "🟩" : "🟥") : "⬜";
  }).join("");
  return `Squint #${puzzleNum} 🔍 ${won ? state.guesses.length : "X"}/${MAX_GUESSES}\n${row}\n${SITE_URL}`;
}

async function copyResult() {
  const text = shareText();
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea");
    t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch {}
    t.remove();
  }
  say("Copied. Paste it anywhere.");
}

/* =========================================================
   COUNTDOWN (local midnight)
   ========================================================= */
function tickCountdown() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const s = Math.max(0, Math.floor((next - now) / 1000));
  const pad = v => String(v).padStart(2, "0");
  $("countdown").textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
}
setInterval(() => { if (state && state.status !== "playing") tickCountdown(); }, 1000);

/* =========================================================
   AUTOCOMPLETE
   ========================================================= */
let matches = [], active = -1;

function updateOptions() {
  const q = input.value.trim().toLowerCase();
  if (!q) { closeOptions(); return; }
  const guessed = new Set(state.guesses.map(g => g.text));
  const pool = ANSWERS.filter(a => !guessed.has(a));
  const starts = pool.filter(a => a.toLowerCase().startsWith(q));
  const contains = pool.filter(a => !a.toLowerCase().startsWith(q) && a.toLowerCase().includes(q));
  matches = [...starts, ...contains].slice(0, 6);
  active = matches.length ? 0 : -1;
  drawOptions(q);
}

function drawOptions(q) {
  if (!matches.length) { closeOptions(); return; }
  options.innerHTML = matches.map((a, i) => {
    const at = a.toLowerCase().indexOf(q);
    const label = escapeHTML(a.slice(0, at)) + "<mark>" + escapeHTML(a.slice(at, at + q.length)) + "</mark>" + escapeHTML(a.slice(at + q.length));
    return `<li role="option" id="opt-${i}" aria-selected="${i === active}" data-value="${escapeHTML(a)}">${label}</li>`;
  }).join("");
  options.hidden = false;
  input.setAttribute("aria-expanded", "true");
  input.setAttribute("aria-activedescendant", active >= 0 ? `opt-${active}` : "");
}

function closeOptions() {
  options.hidden = true; matches = []; active = -1;
  input.setAttribute("aria-expanded", "false");
  input.removeAttribute("aria-activedescendant");
}

input.addEventListener("input", updateOptions);
input.addEventListener("keydown", e => {
  const q = input.value.trim().toLowerCase();
  if (e.key === "ArrowDown" && matches.length) { e.preventDefault(); active = (active + 1) % matches.length; drawOptions(q); }
  else if (e.key === "ArrowUp" && matches.length) { e.preventDefault(); active = (active - 1 + matches.length) % matches.length; drawOptions(q); }
  else if (e.key === "Enter") { e.preventDefault(); submitGuess(active >= 0 ? matches[active] : input.value); }
  else if (e.key === "Escape") closeOptions();
});
options.addEventListener("mousedown", e => {
  const li = e.target.closest("li");
  if (!li) return;
  e.preventDefault();
  submitGuess(li.dataset.value);
});
input.addEventListener("blur", () => setTimeout(closeOptions, 120));

$("guessBtn").addEventListener("click", () => submitGuess(active >= 0 ? matches[active] : input.value));
$("skipBtn").addEventListener("click", skip);
$("shareBtn").addEventListener("click", copyResult);

/* =========================================================
   STATS
   ========================================================= */
function openStats() {
  const pct = stats.played ? Math.round((stats.won / stats.played) * 100) : 0;
  $("statRow").innerHTML = [
    [stats.played, "Played"], [pct + "%", "Solved"], [stats.streak, "Streak"], [stats.maxStreak, "Best streak"]
  ].map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
  const max = Math.max(1, ...stats.dist);
  const todayRow = state && state.status === "won" ? state.guesses.length - 1 : -1;
  $("dist").innerHTML = stats.dist.map((c, i) =>
    `<div class="dist-row"><span>${i + 1}</span><div><div class="bar ${i === todayRow ? "today" : ""}" style="width:${Math.max(8, (c / max) * 100)}%">${c}</div></div></div>`
  ).join("");
  $("stats").showModal();
}
$("statsBtn").addEventListener("click", openStats);
$("closeStats").addEventListener("click", () => $("stats").close());
$("stats").addEventListener("click", e => { if (e.target.id === "stats") $("stats").close(); });

start();
</script>
</body>
</html>
