name: Add landmark puzzles

# Run it from the Actions tab: choose "Add landmark puzzles", then "Run workflow".
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many landmarks to add (try 10 first)"
        required: true
        default: "10"
      max_per_country:
        description: "Most puzzles from any one country"
        required: true
        default: "12"
      photos:
        description: "Which photos to allow"
        required: true
        default: "Public domain or CC BY / CC BY-SA (credited)"
        type: choice
        options:
          - "Public domain or CC BY / CC BY-SA (credited)"
          - "Public domain only"

permissions:
  contents: write
  pages: write

concurrency:
  group: add-landmarks
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install requests pillow numpy "opencv-python-headless>=4.8,<5"

      - name: Look up, check and build the puzzles
        env:
          COUNT: ${{ github.event.inputs.count }}
          MAX_PER_COUNTRY: ${{ github.event.inputs.max_per_country }}
          PHOTOS: ${{ github.event.inputs.photos }}
        run: |
          EXTRA=""
          if [ "$PHOTOS" = "Public domain only" ]; then EXTRA="--public-domain-only"; fi
          python scripts/add_landmarks.py --count "$COUNT" --max-per-country "$MAX_PER_COUNTRY" $EXTRA

      - name: Save the puzzles to the repository
        run: |
          git config user.name "squint-bot"
          git config user.email "squint-bot@users.noreply.github.com"
          git add landmarks
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Add landmark puzzles ($(cat build/private/summary.txt))"
            git push
          fi

      # Pushes made by a workflow don't always republish the site, so ask GitHub Pages directly.
      - name: Republish the website
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will republish on its own."

      # Record files and the review page contain the answers, so they're a private download, not committed.
      - name: Offer the review page and record files as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landmark-review-and-records
          path: build/private/
          retention-days: 90
